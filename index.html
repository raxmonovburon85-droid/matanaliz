<script type="application/json" id="topic-data">[{"id": 1, "title": "To‘plamlar ustida amallar. Akslantirish va uning turlari. Sanoqli to‘plamlar", "theory": [{"kind": "def", "title": "To‘plam va qism to‘plam", "body": "To‘plam — ma’lum belgiga ega bo‘lgan obyektlar majmuasi. $a\\in A$ yozuvi $a$ element $A$ to‘plamga tegishli ekanini bildiradi.\n\nAgar $A$ ning har bir elementi $B$ ga ham tegishli bo‘lsa, $A$ to‘plam $B$ ning **qism to‘plami** deyiladi: $A\\subset B$. Agar $A\\subset B$ va $B\\subset A$ bo‘lsa, $A=B$.\n\nHech qanday elementga ega bo‘lmagan to‘plam bo‘sh to‘plam deyiladi va $\\varnothing$ bilan belgilanadi. $\\varnothing$ ixtiyoriy to‘plamning qism to‘plamidir."}, {"kind": "def", "title": "To‘plamlar ustida amallar", "body": "- Birlashma: $A\\cup B=\\{x:\\ x\\in A \\text{ yoki } x\\in B\\}$\n- Kesishma: $A\\cap B=\\{x:\\ x\\in A \\text{ va } x\\in B\\}$\n- Ayirma: $A\\setminus B=\\{x:\\ x\\in A,\\ x\\notin B\\}$\n- Simmetrik ayirma: $A\\,\\triangle\\, B=(A\\setminus B)\\cup(B\\setminus A)$\n- To‘ldiruvchi: $A\\subset E$ bo‘lsa, $C_E A=E\\setminus A$"}, {"kind": "thm", "title": "De Morgan qonunlari", "body": "$E$ universal to‘plam bo‘lsin. U holda\n$$C_E(A\\cup B)=C_EA\\cap C_EB,\\qquad C_E(A\\cap B)=C_EA\\cup C_EB.$$", "more": "$x\\in C_E(A\\cup B)\\iff x\\notin A\\cup B\\iff x\\notin A$ va $x\\notin B\\iff x\\in C_EA\\cap C_EB$. Ikkinchi tenglik xuddi shunday isbotlanadi.", "moreLabel": "Isbot"}, {"kind": "def", "title": "Akslantirish va uning turlari", "body": "Agar $X$ to‘plamning har bir $x$ elementiga biror qoida bo‘yicha $Y$ to‘plamning bitta $y$ elementi mos qo‘yilgan bo‘lsa, $X$ ni $Y$ ga akslantirish berilgan deyiladi: $f:X\\to Y$, $y=f(x)$.\n- **Inyektiv (in’eksiya):** $x_1\\ne x_2\\Rightarrow f(x_1)\\ne f(x_2)$.\n- **Syurektiv (syur’eksiya):** har bir $y\\in Y$ uchun $f(x)=y$ bo‘ladigan $x\\in X$ topiladi, ya’ni $f(X)=Y$.\n- **Biyektiv (biyeksiya):** ham inyektiv, ham syurektiv. Faqat biyektiv akslantirish teskari akslantirishga ega: $f^{-1}:Y\\to X$."}, {"kind": "ex", "title": "Misollar", "body": "- $f:\\mathbb R\\to\\mathbb R$, $f(x)=x^2$ — na inyektiv ($f(-1)=f(1)$), na syurektiv ($-1$ qiymatni qabul qilmaydi).\n- $f:[0,+\\infty)\\to[0,+\\infty)$, $f(x)=x^2$ — biyektiv, $f^{-1}(y)=\\sqrt y$.\n- $f:\\mathbb N\\to\\mathbb N$, $f(n)=2n$ — inyektiv, lekin syurektiv emas."}, {"kind": "def", "title": "Ekvivalent va sanoqli to‘plamlar", "body": "Agar $A$ va $B$ orasida biyektiv akslantirish mavjud bo‘lsa, ular **ekvivalent** (teng quvvatli) deyiladi: $A\\sim B$.\n\nNatural sonlar to‘plami $\\mathbb N$ ga ekvivalent bo‘lgan to‘plam **sanoqli** deyiladi. Sanoqli to‘plam elementlarini ketma-ketlik ko‘rinishida nomerlab chiqish mumkin: $a_1,a_2,a_3,\\dots$"}, {"kind": "thm", "title": "Sanoqli to‘plamlar haqida teoremalar", "body": "1. Sanoqli to‘plamning har qanday cheksiz qism to‘plami sanoqli.\n2. Sanoqlita sanoqli to‘plamlar birlashmasi sanoqli.\n3. Butun sonlar $\\mathbb Z$ va ratsional sonlar $\\mathbb Q$ to‘plamlari sanoqli.\n4. $[0,1]$ segment sanoqli emas (Kantor). Uning quvvati **kontinuum** deyiladi.", "more": "Faraz qilaylik, $[0,1]$ dagi barcha sonlar $x_1,x_2,\\dots$ ko‘rinishida nomerlangan bo‘lsin va $x_n=0,a_{n1}a_{n2}a_{n3}\\dots$ o‘nli yoyilmalari bo‘lsin. $b=0,b_1b_2b_3\\dots$ sonni shunday tuzamizki, $b_n\\ne a_{nn}$ va $b_n\\notin\\{0,9\\}$ bo‘lsin. U holda $b\\in[0,1]$, lekin $b$ hech bir $x_n$ ga teng emas, chunki $n$-raqamda farq qiladi. Ziddiyat.", "moreLabel": "[0,1] sanoqsizligining isboti (diagonal usul)"}], "quiz": [{"q": "$A=\\{1,2,3,4\\}$, $B=\\{3,4,5\\}$ bo‘lsa, $A\\setminus B$ nimaga teng?", "o": ["$\\{5\\}$", "$\\{1,2\\}$", "$\\{3,4\\}$", "$\\{1,2,5\\}$"], "a": 1, "e": "$A\\setminus B$ — $A$ ning $B$ ga tegishli bo‘lmagan elementlari: 1 va 2."}, {"q": "$A=\\{1,2,3,4\\}$, $B=\\{3,4,5\\}$ uchun $A\\,\\triangle\\,B$ ni toping.", "o": ["$\\{3,4\\}$", "$\\{1,2,3,4,5\\}$", "$\\{1,2,5\\}$", "$\\{5\\}$"], "a": 2, "e": "$A\\triangle B=(A\\setminus B)\\cup(B\\setminus A)=\\{1,2\\}\\cup\\{5\\}$."}, {"q": "$C_E(A\\cap B)$ nimaga teng?", "o": ["$C_EA\\cap C_EB$", "$C_EA\\cup C_EB$", "$E\\setminus(A\\cup B)$", "$A\\cup B$"], "a": 1, "e": "De Morgan qonuni: kesishmaning to‘ldiruvchisi to‘ldiruvchilar birlashmasiga teng."}, {"q": "$f:\\mathbb R\\to\\mathbb R$, $f(x)=e^x$ akslantirish qanday?", "o": ["Inyektiv, lekin syurektiv emas", "Syurektiv, lekin inyektiv emas", "Biyektiv", "Na inyektiv, na syurektiv"], "a": 0, "e": "$e^x$ qat’iy o‘suvchi, demak inyektiv; ammo manfiy qiymatlarni qabul qilmaydi."}, {"q": "$f:\\mathbb R\\to\\mathbb R$, $f(x)=x^3-x$ akslantirish qanday?", "o": ["Inyektiv, lekin syurektiv emas", "Syurektiv, lekin inyektiv emas", "Biyektiv", "Na inyektiv, na syurektiv"], "a": 1, "e": "Uzluksiz va $\\pm\\infty$ ga intiladi — syurektiv; $f(0)=f(1)=0$ — inyektiv emas."}, {"q": "Quyidagilardan qaysi biri sanoqli emas?", "o": ["$\\mathbb Z$", "$\\mathbb Q$", "$(0,1)$ interval", "Barcha juft sonlar to‘plami"], "a": 2, "e": "Kantor diagonal usuli bo‘yicha $[0,1]$ (va $(0,1)$) sanoqsiz."}, {"q": "$n$ ta elementli to‘plamning barcha qism to‘plamlari soni nechta?", "o": ["$n^2$", "$n!$", "$2^n$", "$2n$"], "a": 2, "e": "Har bir element qism to‘plamga kiradi yoki kirmaydi: $2\\cdot2\\cdots2=2^n$."}, {"q": "Qaysi akslantirish $(0,1)$ ni $\\mathbb R$ ga biyektiv akslantiradi?", "o": ["$f(x)=1/x$", "$f(x)=\\tan\\left(\\pi x-\\frac{\\pi}{2}\\right)$", "$f(x)=x^2$", "$f(x)=\\ln x$"], "a": 1, "e": "$\\pi x-\\pi/2$ chiziqli ravishda $(0,1)$ ni $(-\\pi/2,\\pi/2)$ ga o‘tkazadi, $\\tan$ esa uni $\\mathbb R$ ga biyektiv o‘tkazadi. Demak $(0,1)\\sim\\mathbb R$."}], "concept": [{"q": "$\\mathbb N$ va juft natural sonlar to‘plami $2\\mathbb N$ haqida qaysi tasdiq to‘g‘ri?", "o": ["$2\\mathbb N$ ning elementlari $\\mathbb N$ dagidan ikki marta kam", "$\\mathbb N\\sim 2\\mathbb N$, chunki $n\\mapsto 2n$ biyeksiya", "Ular ekvivalent emas, chunki $2\\mathbb N\\subset\\mathbb N$ va $2\\mathbb N\\neq\\mathbb N$", "Bu ikki to‘plamni taqqoslab bo‘lmaydi"], "a": 1, "e": "Cheksiz to‘plam o‘zining xos qism to‘plamiga ekvivalent bo‘lishi mumkin — bu cheksiz to‘plamning xarakterli xossasi (Dedekind ta’rifi)."}], "tf": [{"v": true, "s": "$\\varnothing$ har qanday to‘plamning qism to‘plami.", "n": "Chunki $\\varnothing$ da $A$ ga tegishli bo‘lmagan element yo‘q."}, {"v": false, "s": "Ikki sanoqli to‘plam birlashmasi sanoqsiz bo‘lishi mumkin.", "n": "Sanoqlita sanoqli to‘plamlar birlashmasi ham sanoqli."}, {"v": true, "s": "$\\mathbb Q$ sanoqli to‘plam.", "n": "Kantorning ratsional sonlarni \"ilonsimon\" nomerlash usuli."}, {"v": false, "s": "Har qanday inyektiv akslantirish teskari akslantirishga ega.", "n": "Teskari akslantirish uchun biyektivlik kerak."}, {"v": true, "s": "$A\\setminus B=A\\cap C_EB$.", "n": "Ta’rifdan bevosita kelib chiqadi."}, {"v": false, "s": "$\\mathbb R$ va $(0,1)$ turli quvvatli.", "n": "Ular ekvivalent: $\\tan(\\pi x-\\pi/2)$ biyeksiya."}], "cards": [{"f": "Biyektiv akslantirish", "b": "Ham inyektiv ($x_1\\ne x_2\\Rightarrow f(x_1)\\ne f(x_2)$), ham syurektiv ($f(X)=Y$)."}, {"f": "Sanoqli to‘plam", "b": "$\\mathbb N$ ga ekvivalent to‘plam."}, {"f": "De Morgan qonuni", "b": "$C(A\\cup B)=CA\\cap CB$, $C(A\\cap B)=CA\\cup CB$"}, {"f": "Simmetrik ayirma", "b": "$A\\triangle B=(A\\setminus B)\\cup(B\\setminus A)$"}, {"f": "Kontinuum", "b": "$[0,1]$ segment (yoki $\\mathbb R$) ning quvvati."}, {"f": "Kantor diagonal usuli", "b": "$[0,1]$ ning sanoqsizligini isbotlaydi."}], "tasks": [{"lvl": "A", "q": "$A=[0,3]$, $B=(1,5)$ bo‘lsa, $A\\cup B$, $A\\cap B$, $A\\setminus B$, $B\\setminus A$ ni toping.", "h": "Sonlar o‘qida chizib ko‘ring; chegara nuqtalarga e’tibor bering.", "s": "$A\\cup B=[0,5)$, $A\\cap B=(1,3]$, $A\\setminus B=[0,1]$, $B\\setminus A=(3,5)$."}, {"lvl": "A", "q": "$\\{a,b,c,d\\}$ to‘plamning nechta qism to‘plami bor?", "h": "Har bir element uchun ikki imkoniyat bor.", "ans": 16.0, "s": "$2^4=16$ ta."}, {"lvl": "B", "q": "$A\\cap(B\\cup C)=(A\\cap B)\\cup(A\\cap C)$ tengligini isbotlang.", "h": "Ikki tomonlama qism to‘plamlik: chap tomondagi ixtiyoriy $x$ o‘ng tomonda ekanini, va aksincha, ko‘rsating.", "s": "$x\\in A\\cap(B\\cup C)\\iff x\\in A$ va ($x\\in B$ yoki $x\\in C$) $\\iff$ ($x\\in A$ va $x\\in B$) yoki ($x\\in A$ va $x\\in C$) $\\iff x\\in(A\\cap B)\\cup(A\\cap C)$."}, {"lvl": "B", "q": "$f:\\mathbb Z\\to\\mathbb N$ biyeksiya tuzing va $\\mathbb Z$ sanoqli ekanini ko‘rsating.", "h": "Nolni 1 ga, musbat sonlarni juft sonlarga, manfiylarni toq sonlarga o‘tkazing.", "s": "$f(0)=1$, $f(k)=2k$ ($k>0$), $f(-k)=2k+1$ ($k>0$). Bu biyeksiya."}, {"lvl": "C", "q": "$[0,1]$ va $[0,1)$ to‘plamlar ekvivalent ekanini isbotlang (biyeksiyani aniq yozing).", "h": "$\\{1,\\tfrac12,\\tfrac13,\\dots\\}$ ketma-ketlikni bir qadam \"suring\".", "s": "$f(1/n)=1/(n+1)$, $n\\ge1$; qolgan nuqtalarda $f(x)=x$. Bu $[0,1]$ ni $[0,1)$ ga biyektiv akslantiradi."}], "parsons": [{"title": "$\\mathbb Q$ ning sanoqliligi isboti", "steps": ["Har bir musbat ratsional sonni qisqarmas kasr $p/q$ ko‘rinishida yozamiz.", "$p/q$ ga \"balandlik\" $h=p+q$ ni mos qo‘yamiz.", "Har bir $h$ uchun bunday kasrlar soni chekli (ko‘pi bilan $h-1$ ta).", "Kasrlarni avval $h$ bo‘yicha, so‘ng $p$ bo‘yicha tartiblab, nomerlab chiqamiz.", "Demak $\\mathbb Q_+$ sanoqli; $\\mathbb Q=\\mathbb Q_-\\cup\\{0\\}\\cup\\mathbb Q_+$ ham sanoqli."], "dis": ["Har bir ratsional son cheksiz o‘nli kasr bo‘lgani uchun ularni nomerlab bo‘lmaydi."]}], "short": "To‘plamlar", "az": "1-bob, 1–3-§ (6–18-betlar)", "lebl": "0.3 Basic set theory; 1.4 Intervals and the size of R", "lab": ["venn", "cantor"], "goals": ["To‘plamlar ustida birlashma, kesishma, ayirma va to‘ldiruvchi amallarini bajara olish", "Inyektiv, syurektiv va biyektiv akslantirishlarni farqlash", "Sanoqli va sanoqsiz to‘plamlarga misol keltira olish va buni isbotlash"]}, {"id": 2, "title": "Haqiqiy son tushunchasi. Haqiqiy sonlar to‘plami va uning xossalari. Sonli to‘plamlarning chegaralari", "theory": [{"kind": "note", "title": "Nega ratsional sonlar yetarli emas?", "body": "$x^2=2$ tenglama ratsional yechimga ega emas. Faraz qilaylik $\\sqrt2=p/q$ qisqarmas kasr bo‘lsin. U holda $p^2=2q^2$, demak $p$ juft: $p=2k$. Unda $q^2=2k^2$, demak $q$ ham juft — ziddiyat. Shunday qilib $\\mathbb Q$ da \"bo‘shliqlar\" bor; haqiqiy sonlar ularni to‘ldiradi."}, {"kind": "def", "title": "Ratsional sonlarda kesim (Dedekind)", "body": "$\\mathbb Q$ ni ikki bo‘sh bo‘lmagan $A$ va $A'$ sinflarga shunday ajratamizki, har bir son ulardan faqat biriga tegishli va $\\forall a\\in A,\\ \\forall a'\\in A':\\ a<a'$. Bunday ajratish **kesim** deyiladi: $(A|A')$.\n\nAgar $A$ da eng katta element ham, $A'$ da eng kichik element ham bo‘lmasa, kesim irratsional sonni aniqlaydi. Masalan, $A=\\{r: r\\le0 \\text{ yoki } r^2<2\\}$ kesim $\\sqrt2$ ni aniqlaydi."}, {"kind": "def", "title": "Yuqoridan (quyidan) chegaralangan to‘plam", "body": "$E\\subset\\mathbb R$ to‘plam **yuqoridan chegaralangan** deyiladi, agar shunday $M$ son topilsaki, $\\forall x\\in E:\\ x\\le M$. $M$ — yuqori chegara.\n\nQuyidan chegaralanganlik ham xuddi shunday: $\\exists m\\ \\forall x\\in E:\\ x\\ge m$. Ham yuqoridan, ham quyidan chegaralangan to‘plam **chegaralangan** deyiladi."}, {"kind": "def", "title": "Aniq yuqori chegara (supremum)", "body": "$E$ ning yuqori chegaralari ichida eng kichigi $E$ ning **aniq yuqori chegarasi** deyiladi: $\\sup E$. Ekvivalent ta’rif: $a=\\sup E$ bo‘ladi, agar\n1. $\\forall x\\in E:\\ x\\le a$;\n2. $\\forall\\varepsilon>0\\ \\exists x_\\varepsilon\\in E:\\ x_\\varepsilon>a-\\varepsilon$.\n\nInfimum ham shunday: $\\inf E$ — quyi chegaralarning eng kattasi."}, {"kind": "thm", "title": "To‘liqlik teoremasi", "body": "Yuqoridan chegaralangan har qanday bo‘sh bo‘lmagan $E\\subset\\mathbb R$ to‘plam aniq yuqori chegaraga ega. Quyidan chegaralangan to‘plam esa aniq quyi chegaraga ega.\n\nBu xossa $\\mathbb R$ ni $\\mathbb Q$ dan ajratib turadi: $\\{r\\in\\mathbb Q: r^2<2\\}$ to‘plamning $\\mathbb Q$ da supremumi yo‘q."}, {"kind": "thm", "title": "Arximed xossasi", "body": "Har qanday $x\\in\\mathbb R$ uchun shunday $n\\in\\mathbb N$ topiladiki, $n>x$. Natija: $\\forall\\varepsilon>0\\ \\exists n:\\ 1/n<\\varepsilon$.\n\nRatsional sonlarning zichligi: har qanday $a<b$ haqiqiy sonlar orasida ratsional son mavjud.", "more": "Faraz qilaylik $\\mathbb N$ yuqoridan chegaralangan. U holda $s=\\sup\\mathbb N$ mavjud. $s-1<s$ bo‘lgani uchun $s-1$ yuqori chegara emas: $\\exists n>s-1$. Unda $n+1>s$ va $n+1\\in\\mathbb N$ — ziddiyat.", "moreLabel": "Isbot"}, {"kind": "formula", "title": "Absolyut qiymat xossalari", "body": "- $|x|\\le a\\iff -a\\le x\\le a$\n- $|x+y|\\le|x|+|y|$ (uchburchak tengsizligi)\n- $\\big||x|-|y|\\big|\\le|x-y|$\n- $|xy|=|x||y|$"}], "quiz": [{"q": "$E=\\{x\\in\\mathbb R:\\ x^2<4\\}$ uchun $\\sup E$ nimaga teng?", "o": ["$4$", "$2$", "$\\sqrt2$", "Mavjud emas"], "a": 1, "e": "$E=(-2,2)$, demak $\\sup E=2$."}, {"q": "$E=\\{\\frac{(-1)^n}{n}:\\ n\\in\\mathbb N\\}$ uchun $\\inf E$ va $\\sup E$ ni toping.", "o": ["$\\inf E=-1$, $\\sup E=1$", "$\\inf E=-1$, $\\sup E=\\frac12$", "$\\inf E=0$, $\\sup E=\\frac12$", "$\\inf E=-\\frac12$, $\\sup E=1$"], "a": 1, "e": "Elementlar: $-1,\\frac12,-\\frac13,\\frac14,\\dots$. Eng kichigi $-1$, eng kattasi $\\frac12$."}, {"q": "$a=\\sup E$ ta’rifidagi ikkinchi shart qaysi?", "o": ["$\\forall x\\in E:\\ x\\ge a$", "$\\forall\\varepsilon>0\\ \\exists x\\in E:\\ x>a-\\varepsilon$", "$\\exists\\varepsilon>0\\ \\forall x\\in E:\\ x>a-\\varepsilon$", "$a\\in E$"], "a": 1, "e": "Bu shart $a$ dan kichikroq son yuqori chegara bo‘la olmasligini ifodalaydi."}, {"q": "Qaysi to‘plamning $\\mathbb Q$ ichida supremumi yo‘q?", "o": ["$\\{r\\in\\mathbb Q: r<1\\}$", "$\\{r\\in\\mathbb Q: r^2<2\\}$", "$\\{r\\in\\mathbb Q: r^2\\le4\\}$", "$\\{1/n:\\ n\\in\\mathbb N\\}$"], "a": 1, "e": "$\\sqrt2\\notin\\mathbb Q$, shuning uchun bu to‘plamning ratsional aniq yuqori chegarasi yo‘q."}, {"q": "$|x-3|<2$ tengsizlik qaysi oraliqni ifodalaydi?", "o": ["$(-2,2)$", "$(1,5)$", "$(-5,-1)$", "$[1,5]$"], "a": 1, "e": "$-2<x-3<2\\iff1<x<5$."}, {"q": "Arximed xossasi nimani tasdiqlaydi?", "o": ["$\\mathbb R$ sanoqsiz", "$\\forall x\\in\\mathbb R\\ \\exists n\\in\\mathbb N:\\ n>x$", "Har qanday chegaralangan to‘plam supremumga ega", "$\\sqrt2$ irratsional"], "a": 1, "e": "Natural sonlar to‘plami yuqoridan chegaralanmagan."}, {"q": "$\\inf\\{\\frac{n}{n+1}:\\ n\\in\\mathbb N\\}$ nimaga teng?", "o": ["$\\frac12$", "$0$", "$1$", "Mavjud emas"], "a": 0, "e": "Ketma-ketlik o‘suvchi; eng kichik hadi $n=1$ da $\\frac12$."}, {"q": "Agar $E\\subset F$ va ikkalasi chegaralangan bo‘lsa, qaysi tengsizlik doim to‘g‘ri?", "o": ["$\\sup E\\le\\sup F$", "$\\sup E\\ge\\sup F$", "$\\inf E\\le\\inf F$", "$\\sup E=\\sup F$"], "a": 0, "e": "$F$ ning yuqori chegarasi $E$ uchun ham yuqori chegara, shuning uchun $\\sup E\\le\\sup F$ (va $\\inf E\\ge\\inf F$)."}], "concept": [{"q": "$E=\\{1-\\frac1n:\\ n\\in\\mathbb N\\}$ uchun qaysi tasdiq to‘g‘ri?", "o": ["$\\sup E=1$ va $1\\in E$", "$\\sup E=1$, lekin $1\\notin E$", "$\\sup E$ mavjud emas", "$\\max E=1$"], "a": 1, "e": "Har bir element $1$ dan kichik, ammo $1-\\frac1n>1-\\varepsilon$ ixtiyoriy $\\varepsilon$ uchun biror $n$ da bajariladi. Supremum to‘plamga tegishli bo‘lishi shart emas."}], "tf": [{"v": true, "s": "$\\sqrt2$ irratsional son.", "n": "$p^2=2q^2$ dan $p$ va $q$ ikkalasi juft bo‘lishi kelib chiqadi."}, {"v": false, "s": "Supremum doim to‘plamga tegishli.", "n": "$\\sup(0,1)=1\\notin(0,1)$."}, {"v": true, "s": "Ikki haqiqiy son orasida doim ratsional son bor.", "n": "Ratsional sonlarning zichligi (Arximed xossasidan)."}, {"v": true, "s": "$|x+y|\\le|x|+|y|$ ixtiyoriy haqiqiy $x,y$ uchun.", "n": "Uchburchak tengsizligi."}, {"v": false, "s": "$\\mathbb N$ yuqoridan chegaralangan.", "n": "Arximed xossasiga zid."}, {"v": true, "s": "Agar $\\max E$ mavjud bo‘lsa, $\\sup E=\\max E$.", "n": "Eng katta element eng kichik yuqori chegara ham."}], "cards": [{"f": "$\\sup E$ ning $\\varepsilon$-ta’rifi", "b": "$\\forall x\\in E: x\\le a$ va $\\forall\\varepsilon>0\\ \\exists x\\in E: x>a-\\varepsilon$"}, {"f": "To‘liqlik aksiomasi", "b": "Yuqoridan chegaralangan bo‘sh bo‘lmagan to‘plam $\\mathbb R$ da supremumga ega."}, {"f": "Arximed xossasi", "b": "$\\forall x\\ \\exists n\\in\\mathbb N:\\ n>x$"}, {"f": "Dedekind kesimi", "b": "$\\mathbb Q$ ni $A|A'$ sinflarga ajratish; $\\forall a\\in A,a'\\in A': a<a'$."}, {"f": "Uchburchak tengsizligi", "b": "$|x+y|\\le|x|+|y|$"}, {"f": "$\\inf E$", "b": "Quyi chegaralarning eng kattasi."}], "tasks": [{"lvl": "A", "q": "$E=\\{\\frac{2n+1}{n}:\\ n\\in\\mathbb N\\}$ uchun $\\sup E$ va $\\inf E$ ni toping.", "h": "$\\frac{2n+1}{n}=2+\\frac1n$.", "s": "$\\sup E=\\max E=3$ ($n=1$), $\\inf E=2$ (to‘plamga tegishli emas)."}, {"lvl": "A", "q": "$|2x-1|\\le3$ tengsizlikni yeching.", "h": "$-3\\le 2x-1\\le 3$.", "s": "$-1\\le x\\le 2$."}, {"lvl": "B", "q": "$\\sqrt3$ irratsional ekanini isbotlang.", "h": "$p^2=3q^2$ dan $p$ ning 3 ga bo‘linishini keltirib chiqaring.", "s": "Agar $p^2=3q^2$ bo‘lsa, $3\\mid p$, $p=3k$, $q^2=3k^2$, demak $3\\mid q$ — qisqarmas kasr farazga zid."}, {"lvl": "B", "q": "$\\inf\\{\\frac1n:\\ n\\in\\mathbb N\\}=0$ ekanini ta’rif yordamida isbotlang.", "h": "Ikkinchi shart uchun Arximed xossasidan foydalaning.", "s": "$\\frac1n>0$, ya’ni 0 quyi chegara. $\\forall\\varepsilon>0$ uchun Arximed bo‘yicha $n>1/\\varepsilon$ topiladi, u holda $\\frac1n<0+\\varepsilon$."}, {"lvl": "C", "q": "$A,B\\subset\\mathbb R$ chegaralangan, $A+B=\\{a+b:\\ a\\in A,b\\in B\\}$. $\\sup(A+B)=\\sup A+\\sup B$ ekanini isbotlang.", "h": "Avval $\\sup A+\\sup B$ yuqori chegara ekanini, so‘ng $\\varepsilon/2$ dan foydalanib eng kichikligini ko‘rsating.", "s": "$a+b\\le\\sup A+\\sup B$. $\\forall\\varepsilon$: $a>\\sup A-\\varepsilon/2$, $b>\\sup B-\\varepsilon/2$ topiladi, demak $a+b>\\sup A+\\sup B-\\varepsilon$."}], "parsons": [], "short": "Haqiqiy sonlar", "az": "2-bob, 3–8-§ (29–54-betlar)", "lebl": "1.1 Basic properties; 1.2 The set of real numbers; 1.3 Absolute value", "lab": ["supinf"], "goals": ["Ratsional sonlar to‘plamining \"teshiklari\" borligini tushunish", "Supremum va infimum ta’riflarini $\\varepsilon$-tilida qo‘llash", "To‘liqlik (Dedekind) aksiomasi va Arximed xossasidan foydalanish"]}, {"id": 3, "title": "Sonlar ketma-ketligi. Chegaralangan va chegaralanmagan ketma-ketliklar. Cheksiz kichik va cheksiz katta ketma-ketliklar", "theory": [{"kind": "def", "title": "Sonlar ketma-ketligi", "body": "Har bir natural $n$ songa biror haqiqiy $x_n$ sonni mos qo‘yuvchi $f:\\mathbb N\\to\\mathbb R$ akslantirish **sonlar ketma-ketligi** deyiladi: $\\{x_n\\}=x_1,x_2,\\dots,x_n,\\dots$\n\nKetma-ketlik umumiy hadining formulasi ($x_n=\\frac1n$), rekurrent qoida ($x_1=x_2=1,\\ x_{n}=x_{n-1}+x_{n-2}$ — Fibonachchi sonlari) yoki so‘z bilan berilishi mumkin."}, {"kind": "def", "title": "Chegaralangan ketma-ketlik", "body": "$\\{x_n\\}$ **yuqoridan chegaralangan**: $\\exists M\\ \\forall n:\\ x_n\\le M$.\n\n**Quyidan chegaralangan**: $\\exists m\\ \\forall n:\\ x_n\\ge m$.\n\n**Chegaralangan**: $\\exists M>0\\ \\forall n:\\ |x_n|\\le M$.\n\n**Yuqoridan chegaralanmagan**: $\\forall M\\ \\exists n_0:\\ x_{n_0}>M$."}, {"kind": "def", "title": "Cheksiz kichik ketma-ketlik", "body": "$\\{\\alpha_n\\}$ **cheksiz kichik** deyiladi, agar\n$$\\forall\\varepsilon>0\\ \\exists n_0\\in\\mathbb N\\ \\forall n>n_0:\\ |\\alpha_n|<\\varepsilon.$$\nMisollar: $\\frac1n$, $\\frac{(-1)^n}{n^2}$, $q^n$ ($|q|<1$)."}, {"kind": "def", "title": "Cheksiz katta ketma-ketlik", "body": "$\\{x_n\\}$ **cheksiz katta** deyiladi, agar\n$$\\forall M>0\\ \\exists n_0\\ \\forall n>n_0:\\ |x_n|>M.$$\nMasalan, $n^2$, $(-1)^n n$, $2^n$. Diqqat: $x_n=n\\sin^2\\frac{\\pi n}{2}$ chegaralanmagan, lekin cheksiz katta emas (juft $n$ da $x_n=0$)."}, {"kind": "thm", "title": "Cheksiz kichiklarning xossalari", "body": "1. Chekli sondagi cheksiz kichiklar yig‘indisi cheksiz kichik.\n2. Chegaralangan ketma-ketlikning cheksiz kichikka ko‘paytmasi cheksiz kichik.\n3. Agar $\\{x_n\\}$ cheksiz katta bo‘lsa, $\\{1/x_n\\}$ cheksiz kichik; agar $\\{\\alpha_n\\}$ cheksiz kichik va $\\alpha_n\\ne0$ bo‘lsa, $\\{1/\\alpha_n\\}$ cheksiz katta.", "more": "$|y_n|\\le M$ va $\\alpha_n$ cheksiz kichik bo‘lsin. $\\forall\\varepsilon>0$ uchun $\\exists n_0\\ \\forall n>n_0:\\ |\\alpha_n|<\\varepsilon/M$. U holda $|y_n\\alpha_n|\\le M\\cdot\\frac{\\varepsilon}{M}=\\varepsilon$.", "moreLabel": "2-xossaning isboti"}, {"kind": "ex", "title": "Misol: $x_n=\\frac{\\sin n}{n}$", "body": "$|\\sin n|\\le1$ — chegaralangan, $\\frac1n$ — cheksiz kichik. 2-xossaga ko‘ra $\\frac{\\sin n}{n}$ cheksiz kichik."}], "quiz": [{"q": "Qaysi ketma-ketlik chegaralangan?", "o": ["$x_n=n$", "$x_n=\\frac{n}{n+1}$", "$x_n=(-1)^n n$", "$x_n=\\ln n$"], "a": 1, "e": "$0<\\frac{n}{n+1}<1$."}, {"q": "Qaysi ketma-ketlik cheksiz kichik?", "o": ["$x_n=\\frac{n}{n+1}$", "$x_n=(-1)^n$", "$x_n=\\frac{(-1)^n}{\\sqrt n}$", "$x_n=\\cos n$"], "a": 2, "e": "$\\left|\\frac{(-1)^n}{\\sqrt n}\\right|=\\frac1{\\sqrt n}\\to0$."}, {"q": "$\\{x_n\\}$ yuqoridan chegaralanmaganligining ta’rifi qaysi?", "o": ["$\\exists M\\ \\forall n:\\ x_n>M$", "$\\forall M\\ \\exists n:\\ x_n>M$", "$\\forall M\\ \\forall n:\\ x_n>M$", "$\\exists n\\ \\forall M:\\ x_n>M$"], "a": 1, "e": "Bu \"$\\exists M\\ \\forall n: x_n\\le M$\" ning inkori."}, {"q": "$\\alpha_n=\\frac1n$ uchun $\\varepsilon=0{,}01$ bo‘lganda eng kichik mos $n_0$ qaysi?", "o": ["$10$", "$100$", "$1000$", "$99$"], "a": 1, "e": "$\\frac1n<0{,}01\\iff n>100$; demak $n_0=100$."}, {"q": "$x_n=\\frac{\\cos n^2}{n}$ ketma-ketlik qanday?", "o": ["Cheksiz kichik", "Cheksiz katta", "Chegaralanmagan", "Uzoqlashuvchi"], "a": 0, "e": "Chegaralangan $\\cos n^2$ ning cheksiz kichik $\\frac1n$ ga ko‘paytmasi."}, {"q": "Agar $x_n$ cheksiz katta bo‘lsa, $\\frac1{x_n}$ qanday bo‘ladi?", "o": ["Cheksiz katta", "Cheksiz kichik", "Chegaralanmagan", "Har doim musbat"], "a": 1, "e": "Cheksiz katta va cheksiz kichiklar orasidagi bog‘lanish."}, {"q": "Ikki cheksiz katta ketma-ketlik yig‘indisi haqida nima deyish mumkin?", "o": ["Doim cheksiz katta", "Doim cheksiz kichik", "Har xil bo‘lishi mumkin", "Doim chegaralangan"], "a": 2, "e": "$n+(-n)=0$, $n+n=2n$. Bu $\\infty-\\infty$ aniqmasligi."}, {"q": "$x_n=q^n$ qachon cheksiz kichik?", "o": ["$q>1$", "$|q|<1$", "$q=1$", "$q=-1$"], "a": 1, "e": "$|q|<1$ da $|q|^n\\to0$."}], "concept": [{"q": "$x_n=n^{(-1)^n}$ ketma-ketlik haqida qaysi tasdiq to‘g‘ri?", "o": ["Cheksiz katta", "Yuqoridan chegaralanmagan, lekin cheksiz katta emas", "Chegaralangan", "Cheksiz kichik"], "a": 1, "e": "Juft $n$ da $x_n=n$, toq $n$ da $x_n=\\frac1n$. Toq hadlar cheksiz katta bo‘lish shartini buzadi."}], "tf": [{"v": true, "s": "Har qanday cheksiz kichik ketma-ketlik chegaralangan.", "n": "Chekli sondagi boshlang‘ich hadlardan keyin $|\\alpha_n|<1$."}, {"v": false, "s": "Har qanday chegaralanmagan ketma-ketlik cheksiz katta.", "n": "$n^{(-1)^n}$ misoli."}, {"v": true, "s": "Ikki cheksiz kichik ko‘paytmasi cheksiz kichik.", "n": "Cheksiz kichik chegaralangan bo‘lgani uchun."}, {"v": false, "s": "Ikki cheksiz kichik nisbati cheksiz kichik.", "n": "$\\frac{1/n}{1/n}=1$."}, {"v": true, "s": "$\\frac{n!}{n^n}$ cheksiz kichik.", "n": "$\\frac{n!}{n^n}\\le\\frac1n$."}, {"v": true, "s": "$2^n$ cheksiz katta.", "n": "$2^n>n$."}], "cards": [{"f": "Chegaralangan ketma-ketlik", "b": "$\\exists M>0\\ \\forall n:\\ |x_n|\\le M$"}, {"f": "Cheksiz kichik", "b": "$\\forall\\varepsilon>0\\ \\exists n_0\\ \\forall n>n_0:\\ |\\alpha_n|<\\varepsilon$"}, {"f": "Cheksiz katta", "b": "$\\forall M>0\\ \\exists n_0\\ \\forall n>n_0:\\ |x_n|>M$"}, {"f": "Chegaralangan × cheksiz kichik", "b": "Cheksiz kichik"}, {"f": "Fibonachchi ketma-ketligi", "b": "$x_1=x_2=1,\\ x_n=x_{n-1}+x_{n-2}$"}, {"f": "$1/(\\text{cheksiz katta})$", "b": "Cheksiz kichik"}], "tasks": [{"lvl": "A", "q": "$x_n=\\frac{3n-1}{n+2}$ chegaralangan ekanini ko‘rsating va $M$ ni toping.", "h": "$\\frac{3n-1}{n+2}=3-\\frac{7}{n+2}$.", "s": "$\\frac23\\le x_n<3$, demak $|x_n|<3$."}, {"lvl": "A", "q": "$\\alpha_n=\\frac{1}{n^2}$ uchun $\\varepsilon=10^{-4}$ ga mos eng kichik $n_0$ ni toping ($\\forall n>n_0:\\ \\alpha_n<\\varepsilon$).", "h": "$n^2>10^4$.", "ans": 100.0, "s": "$n>100$, demak $n_0=100$."}, {"lvl": "B", "q": "$x_n=\\frac{n^2+1}{n}$ cheksiz katta ekanini ta’rif bo‘yicha isbotlang.", "h": "$x_n>n$.", "s": "$x_n=n+\\frac1n>n$. $\\forall M$ uchun $n_0=[M]+1$ olsak, $n>n_0\\Rightarrow x_n>M$."}, {"lvl": "B", "q": "$x_n=\\sqrt{n+1}-\\sqrt n$ cheksiz kichik ekanini isbotlang.", "h": "Qo‘shmasiga ko‘paytiring.", "s": "$x_n=\\frac{1}{\\sqrt{n+1}+\\sqrt n}<\\frac1{2\\sqrt n}<\\varepsilon$, agar $n>\\frac1{4\\varepsilon^2}$."}, {"lvl": "C", "q": "$x_n=\\frac{a^n}{n!}$ ($a>0$) cheksiz kichik ekanini isbotlang.", "h": "$n>2a$ bo‘lganda $\\frac{x_{n+1}}{x_n}=\\frac{a}{n+1}<\\frac12$.", "s": "$N>2a$ tayinlansa, $n>N$ uchun $x_n\\le x_N\\left(\\tfrac12\\right)^{n-N}\\to0$."}], "parsons": [], "short": "Ketma-ketliklar", "az": "3-bob, 1–2, 5-§ (63–82-betlar)", "lebl": "2.1 Sequences and limits", "lab": ["seqbound"], "goals": ["Ketma-ketlikning chegaralanganligini ta’rif asosida tekshirish", "Cheksiz kichik va cheksiz katta ketma-ketliklarni aniqlash", "Ular orasidagi bog‘lanishni qo‘llash"]}, {"id": 4, "title": "Sonlar ketma-ketligi limiti. Yaqinlashuvchi ketma-ketliklarning xossalari. Monoton ketma-ketliklarning limiti", "theory": [{"kind": "def", "title": "Ketma-ketlik limiti", "body": "$a$ son $\\{x_n\\}$ ning **limiti** deyiladi, agar\n$$\\forall\\varepsilon>0\\ \\exists n_0\\in\\mathbb N\\ \\forall n>n_0:\\ |x_n-a|<\\varepsilon.$$\nYozuv: $\\lim\\limits_{n\\to\\infty}x_n=a$ yoki $x_n\\to a$. Geometrik ma’nosi: $a$ ning ixtiyoriy $\\varepsilon$-atrofidan tashqarida ketma-ketlikning faqat chekli sondagi hadlari qoladi."}, {"kind": "ex", "title": "Misol: $\\lim\\frac{n}{n+1}=1$", "body": "$\\left|\\frac{n}{n+1}-1\\right|=\\frac1{n+1}<\\varepsilon\\iff n>\\frac1\\varepsilon-1$. Demak $n_0=\\left[\\frac1\\varepsilon\\right]$ deb olish yetarli."}, {"kind": "thm", "title": "Yaqinlashuvchi ketma-ketliklar xossalari", "body": "1. Limit yagona.\n2. Yaqinlashuvchi ketma-ketlik chegaralangan.\n3. Agar $x_n\\to a$, $a>p$ bo‘lsa, biror $n_0$ dan boshlab $x_n>p$.\n4. Agar $x_n\\le y_n$ va ikkalasi yaqinlashsa, $\\lim x_n\\le\\lim y_n$.\n5. **Ikki militsioner (siqish) teoremasi:** $x_n\\le y_n\\le z_n$ va $x_n\\to a$, $z_n\\to a$ bo‘lsa, $y_n\\to a$.", "more": "$x_n\\to a$, $x_n\\to b$, $a\\ne b$ bo‘lsin. $\\varepsilon=\\frac{|a-b|}2$ olamiz. Yetarlicha katta $n$ da $|x_n-a|<\\varepsilon$ va $|x_n-b|<\\varepsilon$, demak $|a-b|\\le|x_n-a|+|x_n-b|<2\\varepsilon=|a-b|$ — ziddiyat.", "moreLabel": "Limit yagonaligining isboti"}, {"kind": "formula", "title": "Arifmetik amallar", "body": "$x_n\\to a$, $y_n\\to b$ bo‘lsa:\n- $x_n\\pm y_n\\to a\\pm b$\n- $x_ny_n\\to ab$\n- $\\frac{x_n}{y_n}\\to\\frac ab$ ($b\\ne0$)\n\nAniqmasliklar: $\\frac00,\\ \\frac\\infty\\infty,\\ 0\\cdot\\infty,\\ \\infty-\\infty,\\ 1^\\infty,\\ 0^0,\\ \\infty^0$."}, {"kind": "thm", "title": "Veyershtrass teoremasi (monoton ketma-ketlik)", "body": "Agar $\\{x_n\\}$ o‘suvchi va yuqoridan chegaralangan bo‘lsa, u yaqinlashadi va $\\lim x_n=\\sup\\{x_n\\}$. Kamayuvchi va quyidan chegaralangan ketma-ketlik ham yaqinlashadi va $\\lim x_n=\\inf\\{x_n\\}$.", "more": "$a=\\sup x_n$ bo‘lsin. $\\forall\\varepsilon\\ \\exists n_0:\\ x_{n_0}>a-\\varepsilon$. O‘suvchilikdan $n>n_0$ uchun $a-\\varepsilon<x_{n_0}\\le x_n\\le a$, ya’ni $|x_n-a|<\\varepsilon$.", "moreLabel": "Isbot"}, {"kind": "thm", "title": "$e$ soni", "body": "$x_n=\\left(1+\\frac1n\\right)^n$ o‘suvchi va $x_n<3$. Demak u yaqinlashadi:\n$$e=\\lim_{n\\to\\infty}\\left(1+\\frac1n\\right)^n\\approx2{,}718281828\\dots$$"}, {"kind": "formula", "title": "Muhim ketma-ketlik limitlari", "body": "- $\\lim\\sqrt[n]{a}=1$ ($a>0$), $\\lim\\sqrt[n]{n}=1$\n- $\\lim q^n=0$ ($|q|<1$)\n- $\\lim\\frac{n^k}{a^n}=0$ ($a>1$), $\\lim\\frac{a^n}{n!}=0$"}], "quiz": [{"q": "$\\lim\\limits_{n\\to\\infty}\\frac{3n^2-n}{2n^2+5}$ ni toping.", "o": ["$0$", "$\\frac32$", "$\\infty$", "$-\\frac15$"], "a": 1, "e": "Surat va maxrajni $n^2$ ga bo‘lamiz: $\\frac{3-1/n}{2+5/n^2}\\to\\frac32$."}, {"q": "$\\lim\\limits_{n\\to\\infty}\\left(1+\\frac2n\\right)^n$ nimaga teng?", "o": ["$e$", "$e^2$", "$2$", "$1$"], "a": 1, "e": "$\\left(1+\\frac2n\\right)^n=\\left[\\left(1+\\frac2n\\right)^{n/2}\\right]^2\\to e^2$."}, {"q": "$\\lim\\left(\\sqrt{n^2+n}-n\\right)$ ni toping.", "o": ["$0$", "$1$", "$\\frac12$", "$\\infty$"], "a": 2, "e": "$\\frac{n}{\\sqrt{n^2+n}+n}=\\frac{1}{\\sqrt{1+1/n}+1}\\to\\frac12$."}, {"q": "Qaysi tasdiq noto‘g‘ri?", "o": ["Yaqinlashuvchi ketma-ketlik chegaralangan", "Chegaralangan ketma-ketlik yaqinlashuvchi", "Monoton chegaralangan ketma-ketlik yaqinlashuvchi", "Limit yagona"], "a": 1, "e": "$(-1)^n$ chegaralangan, lekin uzoqlashuvchi."}, {"q": "$\\lim\\sqrt[n]{n}$ nimaga teng?", "o": ["$0$", "$1$", "$e$", "$\\infty$"], "a": 1, "e": "$\\sqrt[n]{n}=1+\\alpha_n$; $n=(1+\\alpha_n)^n\\ge\\frac{n(n-1)}{2}\\alpha_n^2$, ya’ni $\\alpha_n\\le\\sqrt{2/(n-1)}\\to0$."}, {"q": "$\\lim\\frac{2^n+3^n}{3^{n+1}}$ ni toping.", "o": ["$0$", "$1$", "$\\frac13$", "$\\frac23$"], "a": 2, "e": "$\\frac{(2/3)^n+1}{3}\\to\\frac13$."}, {"q": "$x_1=\\sqrt2,\\ x_{n+1}=\\sqrt{2+x_n}$ ketma-ketlik limiti nechaga teng?", "o": ["$\\sqrt2$", "$2$", "$4$", "Mavjud emas"], "a": 1, "e": "O‘suvchi va $x_n<2$; limit $a=\\sqrt{2+a}$ tenglamani qanoatlantiradi: $a=2$."}, {"q": "$\\lim\\frac{\\sin n}{n}$ ni hisoblashda qaysi teorema eng qulay?", "o": ["Ikki militsioner teoremasi", "Veyershtrass teoremasi", "Bolsano–Veyershtrass lemmasi", "Koshi kriteriyasi"], "a": 0, "e": "$-\\frac1n\\le\\frac{\\sin n}{n}\\le\\frac1n$ va chetkilari 0 ga intiladi."}], "concept": [{"q": "$x_n\\to a$ ta’rifida $n_0$ nimaga bog‘liq?", "o": ["Faqat $n$ ga", "$\\varepsilon$ ga (va ketma-ketlikka)", "Faqat $a$ ga", "Hech narsaga, u o‘zgarmas"], "a": 1, "e": "$\\varepsilon$ kichiklashgan sari odatda $n_0$ kattalashadi: $n_0=n_0(\\varepsilon)$."}], "tf": [{"v": true, "s": "Yaqinlashuvchi ketma-ketlikning limiti yagona.", "n": "Isbot $\\varepsilon=|a-b|/2$ tanlash orqali."}, {"v": false, "s": "$x_n<1$ va $x_n\\to a$ bo‘lsa, $a<1$.", "n": "Faqat $a\\le1$: masalan $1-\\frac1n\\to1$."}, {"v": true, "s": "O‘suvchi va yuqoridan chegaralangan ketma-ketlik yaqinlashuvchi.", "n": "Veyershtrass teoremasi."}, {"v": false, "s": "$\\left(1+\\frac1n\\right)^n\\to1$, chunki $1^\\infty=1$.", "n": "$1^\\infty$ — aniqmaslik; limit $e$."}, {"v": true, "s": "Agar $x_n\\to a$ bo‘lsa, $|x_n|\\to|a|$.", "n": "$\\big||x_n|-|a|\\big|\\le|x_n-a|$."}, {"v": false, "s": "Agar $|x_n|\\to|a|$ bo‘lsa, $x_n\\to a$.", "n": "$(-1)^n$: $|x_n|\\to1$, lekin $x_n$ uzoqlashadi."}], "cards": [{"f": "Limit ta’rifi", "b": "$\\forall\\varepsilon>0\\ \\exists n_0\\ \\forall n>n_0:\\ |x_n-a|<\\varepsilon$"}, {"f": "Siqish teoremasi", "b": "$x_n\\le y_n\\le z_n$, $x_n,z_n\\to a\\Rightarrow y_n\\to a$"}, {"f": "Veyershtrass teoremasi", "b": "Monoton va chegaralangan ketma-ketlik yaqinlashadi"}, {"f": "$e$ ning ta’rifi", "b": "$\\lim\\left(1+\\frac1n\\right)^n$"}, {"f": "$\\lim\\sqrt[n]{n}$", "b": "$1$"}, {"f": "$\\lim q^n$, $|q|<1$", "b": "$0$"}], "tasks": [{"lvl": "A", "q": "$\\lim\\limits_{n\\to\\infty}\\frac{5n^3+2n}{2n^3-7}$ ni hisoblang.", "ans": 2.5, "h": "Eng katta darajaga bo‘ling.", "s": "$\\frac{5+2/n^2}{2-7/n^3}\\to\\frac52$."}, {"lvl": "A", "q": "$\\lim\\limits_{n\\to\\infty}\\frac{1+2+\\dots+n}{n^2}$ ni hisoblang.", "h": "$1+2+\\dots+n=\\frac{n(n+1)}2$.", "ans": 0.5, "s": "$\\frac{n(n+1)}{2n^2}\\to\\frac12$."}, {"lvl": "B", "q": "Ta’rif bo‘yicha isbotlang: $\\lim\\frac{2n+1}{n+3}=2$. $\\varepsilon=0{,}01$ uchun $n_0$ ni toping.", "h": "$\\left|\\frac{2n+1}{n+3}-2\\right|=\\frac{5}{n+3}$.", "ans": 497.0, "s": "$\\frac5{n+3}<0{,}01\\iff n>497$. $n_0=497$."}, {"lvl": "B", "q": "$\\lim\\left(1-\\frac1n\\right)^n$ ni toping.", "h": "$\\left(1-\\frac1n\\right)^n=\\left(\\frac{n-1}{n}\\right)^n=\\frac1{\\left(1+\\frac1{n-1}\\right)^{n}}$.", "s": "$\\frac1{\\left(1+\\frac1{n-1}\\right)^{n-1}\\left(1+\\frac1{n-1}\\right)}\\to\\frac1e$."}, {"lvl": "C", "q": "$x_1=1$, $x_{n+1}=\\frac12\\left(x_n+\\frac{3}{x_n}\\right)$ ketma-ketlik yaqinlashishini isbotlang va limitini toping (Geron usuli).", "h": "$n\\ge2$ da $x_n\\ge\\sqrt3$ (Koshi tengsizligi) va $x_{n+1}\\le x_n$.", "s": "AM–GM bo‘yicha $x_{n+1}\\ge\\sqrt3$; $x_{n+1}-x_n=\\frac{3-x_n^2}{2x_n}\\le0$. Kamayuvchi, quyidan chegaralangan; limit $a=\\frac12(a+3/a)$, ya’ni $a=\\sqrt3$."}], "parsons": [{"title": "Veyershtrass teoremasining isboti", "steps": ["$\\{x_n\\}$ o‘suvchi va yuqoridan chegaralangan bo‘lsin; $a=\\sup\\{x_n\\}$ mavjud (to‘liqlik).", "Ixtiyoriy $\\varepsilon>0$ olamiz.", "Supremum ta’rifiga ko‘ra $\\exists n_0:\\ x_{n_0}>a-\\varepsilon$.", "O‘suvchilikdan $n>n_0$ da $x_n\\ge x_{n_0}>a-\\varepsilon$.", "Shuningdek $x_n\\le a<a+\\varepsilon$, demak $|x_n-a|<\\varepsilon$, ya’ni $x_n\\to a$."], "dis": ["Chegaralanganlikdan har bir qism ketma-ketlik yaqinlashadi."]}], "short": "Ketma-ketlik limiti", "az": "3-bob, 2–4, 6–8-§ (64–98-betlar)", "lebl": "2.1 Sequences and limits; 2.2 Facts about limits of sequences", "lab": ["seqlimit"], "goals": ["Limitni $\\varepsilon$–$n_0$ ta’rifi bilan isbotlash", "Limitlar ustida arifmetik amallar va \"siqish\" teoremasini qo‘llash", "Monoton chegaralangan ketma-ketlik teoremasi va $e$ sonini tushunish"]}, {"id": 5, "title": "Ichma-ich joylashgan segmentlar prinsipi. Qismiy ketma-ketliklar. Bolsano–Veyershtrass lemmasi. Fundamental ketma-ketliklar. Koshi teoremasi", "theory": [{"kind": "thm", "title": "Ichma-ich joylashgan segmentlar prinsipi (Kantor)", "body": "$[a_1,b_1]\\supset[a_2,b_2]\\supset\\dots$ segmentlar ketma-ketligi berilgan va $b_n-a_n\\to0$ bo‘lsin. U holda barcha segmentlarga tegishli yagona $c$ nuqta mavjud:\n$$\\bigcap_{n=1}^\\infty[a_n,b_n]=\\{c\\}.$$\nDiqqat: intervallar uchun bu noto‘g‘ri: $\\bigcap(0,\\frac1n)=\\varnothing$.", "more": "$\\{a_n\\}$ o‘suvchi, $\\{b_n\\}$ kamayuvchi va $a_n\\le b_1$. Veyershtrass bo‘yicha $a_n\\to c$, $c=\\sup a_n\\le b_m$ har bir $m$ uchun. Demak $a_n\\le c\\le b_n$. Yagonalik $b_n-a_n\\to0$ dan.", "moreLabel": "Isbot g‘oyasi"}, {"kind": "def", "title": "Qismiy ketma-ketlik", "body": "$\\{x_n\\}$ berilgan va $n_1<n_2<\\dots<n_k<\\dots$ natural sonlarning o‘suvchi ketma-ketligi bo‘lsin. $\\{x_{n_k}\\}$ ketma-ketlik $\\{x_n\\}$ ning **qismiy ketma-ketligi** deyiladi. Uning limiti (agar mavjud bo‘lsa) **qismiy limit** deyiladi.\n\nAgar $x_n\\to a$ bo‘lsa, har qanday qismiy ketma-ketlik ham $a$ ga intiladi."}, {"kind": "thm", "title": "Bolsano–Veyershtrass lemmasi", "body": "Har qanday chegaralangan ketma-ketlikdan yaqinlashuvchi qismiy ketma-ketlik ajratish mumkin.", "more": "$x_n\\in[a,b]$. Segmentni teng ikkiga bo‘lamiz; ulardan kamida birida cheksiz ko‘p had bor — uni $[a_1,b_1]$ deb olamiz va $x_{n_1}\\in[a_1,b_1]$. Jarayonni davom ettirib, ichma-ich segmentlar ($b_k-a_k=\\frac{b-a}{2^k}$) va $x_{n_k}\\in[a_k,b_k]$, $n_k>n_{k-1}$ hosil qilamiz. Kantor prinsipi bo‘yicha umumiy $c$ nuqta bor va $|x_{n_k}-c|\\le\\frac{b-a}{2^k}\\to0$.", "moreLabel": "Isbot (bisektsiya)"}, {"kind": "def", "title": "Yuqori va quyi limitlar", "body": "Ketma-ketlik qismiy limitlarining eng kattasi **yuqori limit** $\\varlimsup x_n$, eng kichigi **quyi limit** $\\varliminf x_n$ deyiladi. $\\{x_n\\}$ yaqinlashuvchi $\\iff$ $\\varlimsup x_n=\\varliminf x_n$ (chekli).\n\nMasalan, $x_n=(-1)^n\\left(1+\\frac1n\\right)$: $\\varlimsup=1$, $\\varliminf=-1$."}, {"kind": "def", "title": "Fundamental (Koshi) ketma-ketlik", "body": "$\\{x_n\\}$ **fundamental** deyiladi, agar\n$$\\forall\\varepsilon>0\\ \\exists n_0\\ \\forall n,m>n_0:\\ |x_n-x_m|<\\varepsilon.$$\nEkvivalent: $\\forall n>n_0,\\ \\forall p\\in\\mathbb N:\\ |x_{n+p}-x_n|<\\varepsilon$."}, {"kind": "thm", "title": "Koshi teoremasi (yaqinlashish kriteriyasi)", "body": "$\\{x_n\\}$ ketma-ketlik yaqinlashuvchi bo‘lishi uchun uning fundamental bo‘lishi zarur va yetarli.\n\nAfzalligi: limitni bilmasdan yaqinlashishni tekshirish mumkin."}, {"kind": "ex", "title": "Garmonik ketma-ketlik uzoqlashadi", "body": "$H_n=1+\\frac12+\\dots+\\frac1n$. $|H_{2n}-H_n|=\\frac1{n+1}+\\dots+\\frac1{2n}\\ge n\\cdot\\frac1{2n}=\\frac12$. Demak $\\{H_n\\}$ fundamental emas va uzoqlashuvchi."}], "quiz": [{"q": "$x_n=(-1)^n+\\frac1n$ uchun $\\varlimsup x_n$ ni toping.", "o": ["$1$", "$2$", "$0$", "$-1$"], "a": 0, "e": "Juft hadlar $1+\\frac1n\\to1$, toq hadlar $-1+\\frac1n\\to-1$."}, {"q": "Bolsano–Veyershtrass lemmasi qaysi ketma-ketliklar uchun o‘rinli?", "o": ["Har qanday", "Chegaralangan", "Monoton", "Faqat musbat"], "a": 1, "e": "Chegaralanmagan $x_n=n$ dan yaqinlashuvchi qismiy ketma-ketlik ajratib bo‘lmaydi."}, {"q": "Qaysi kesishma bo‘sh?", "o": ["$\\bigcap[0,\\frac1n]$", "$\\bigcap(0,\\frac1n)$", "$\\bigcap[-\\frac1n,\\frac1n]$", "$\\bigcap[1-\\frac1n,1+\\frac1n]$"], "a": 1, "e": "Ochiq intervallar uchun Kantor prinsipi o‘rinli emas: $0\\notin(0,\\frac1n)$."}, {"q": "Fundamental ketma-ketlik ta’rifi qaysi?", "o": ["$\\forall\\varepsilon\\ \\exists n_0\\ \\forall n>n_0:\\ |x_{n+1}-x_n|<\\varepsilon$", "$\\forall\\varepsilon\\ \\exists n_0\\ \\forall n,m>n_0:\\ |x_n-x_m|<\\varepsilon$", "$\\exists\\varepsilon\\ \\forall n,m:\\ |x_n-x_m|<\\varepsilon$", "$\\forall n,m:\\ |x_n-x_m|\\to0$"], "a": 1, "e": "Faqat qo‘shni hadlar farqining kichikligi yetarli emas ($\\sqrt n$ misoli)."}, {"q": "$x_n=\\sqrt n$ uchun $x_{n+1}-x_n\\to0$. Bu ketma-ketlik fundamentalmi?", "o": ["Ha", "Yo‘q, chunki u chegaralanmagan", "Ha, chunki qo‘shni hadlar yaqinlashadi", "Aniqlab bo‘lmaydi"], "a": 1, "e": "Fundamental ketma-ketlik chegaralangan bo‘lishi shart; $\\sqrt n\\to\\infty$."}, {"q": "$\\bigcap_{n}\\left[1-\\frac1n,\\ 1+\\frac1{n^2}\\right]$ nimaga teng?", "o": ["$\\varnothing$", "$\\{1\\}$", "$[0,2]$", "$(0,2)$"], "a": 1, "e": "Uzunliklar 0 ga intiladi; har bir segmentda faqat 1 umumiy."}, {"q": "$x_n=\\cos\\frac{2\\pi n}{3}$ ketma-ketlikning quyi limiti nechaga teng?", "o": ["$-\\frac12$", "$-1$", "$0$", "$1$"], "a": 0, "e": "Qiymatlar: $-\\frac12,-\\frac12,1,\\dots$ — qismiy limitlar $\\{-\\frac12,1\\}$."}, {"q": "Koshi kriteriyasining afzalligi nima?", "o": ["U faqat monoton ketma-ketliklar uchun", "Limitni oldindan bilmasdan yaqinlashishni aniqlash mumkin", "Limit qiymatini beradi", "Faqat chegaralanganlikni tekshiradi"], "a": 1, "e": "Faqat hadlarning o‘zaro yaqinligi talab qilinadi."}], "concept": [{"q": "$x_n=\\sin\\frac{\\pi n}{2}$ ketma-ketlikning qismiy limitlari to‘plami qaysi?", "o": ["$\\{0\\}$", "$\\{-1,1\\}$", "$\\{-1,0,1\\}$", "$[-1,1]$"], "a": 2, "e": "Hadlar: $1,0,-1,0,1,0,-1,\\dots$ — uchta qiymat cheksiz ko‘p marta takrorlanadi."}], "tf": [{"v": true, "s": "Yaqinlashuvchi ketma-ketlikning har qanday qismiy ketma-ketligi o‘sha limitga intiladi.", "n": "Bu ta’rifdan bevosita kelib chiqadi."}, {"v": false, "s": "Agar ketma-ketlikning yaqinlashuvchi qismiy ketma-ketligi bo‘lsa, u o‘zi ham yaqinlashuvchi.", "n": "$(-1)^n$."}, {"v": true, "s": "Har qanday fundamental ketma-ketlik chegaralangan.", "n": "$\\varepsilon=1$ uchun $n_0$ dan keyingi hadlar $x_{n_0+1}$ atrofida."}, {"v": true, "s": "$\\mathbb R$ da har qanday fundamental ketma-ketlik yaqinlashadi.", "n": "$\\mathbb R$ ning to‘liqligi; $\\mathbb Q$ da esa bu noto‘g‘ri."}, {"v": false, "s": "$H_n=\\sum_{k=1}^n\\frac1k$ fundamental.", "n": "$H_{2n}-H_n\\ge\\frac12$."}, {"v": true, "s": "$\\varliminf x_n\\le\\varlimsup x_n$.", "n": "Eng kichik qismiy limit eng kattasidan oshmaydi."}], "cards": [{"f": "Kantor prinsipi", "b": "Ichma-ich segmentlar, $b_n-a_n\\to0\\Rightarrow\\bigcap[a_n,b_n]=\\{c\\}$"}, {"f": "Bolsano–Veyershtrass", "b": "Chegaralangan ketma-ketlikdan yaqinlashuvchi qismiy ketma-ketlik ajratish mumkin"}, {"f": "Fundamental ketma-ketlik", "b": "$\\forall\\varepsilon\\ \\exists n_0\\ \\forall n,m>n_0: |x_n-x_m|<\\varepsilon$"}, {"f": "Koshi teoremasi", "b": "Yaqinlashuvchi $\\iff$ fundamental"}, {"f": "Yuqori limit", "b": "Qismiy limitlarning eng kattasi"}, {"f": "Yaqinlashish sharti (limsup)", "b": "$\\varlimsup x_n=\\varliminf x_n$"}], "tasks": [{"lvl": "A", "q": "$x_n=\\frac{n}{n+1}\\cos\\frac{\\pi n}{2}$ ning barcha qismiy limitlarini, $\\varlimsup$ va $\\varliminf$ ni toping.", "h": "$n$ ni 4 ga bo‘lgandagi qoldiq bo‘yicha ajrating.", "s": "Qismiy limitlar: $\\{-1,0,1\\}$; $\\varlimsup=1$, $\\varliminf=-1$."}, {"lvl": "A", "q": "$[1,2]$ segmentni ketma-ket teng ikkiga bo‘lib, har safar $x^2-2$ ishorasi o‘zgaradigan yarmini olsak, 4 qadamdan keyingi segment uzunligi qancha bo‘ladi?", "ans": 0.0625, "h": "Har qadamda uzunlik 2 marta kamayadi.", "s": "$\\frac1{2^4}=0{,}0625$."}, {"lvl": "B", "q": "Koshi kriteriyasi yordamida $x_n=\\sum_{k=1}^n\\frac{\\sin k}{2^k}$ yaqinlashishini isbotlang.", "h": "$|x_{n+p}-x_n|\\le\\sum_{k=n+1}^{n+p}\\frac1{2^k}$.", "s": "$|x_{n+p}-x_n|\\le\\frac1{2^{n+1}}+\\dots<\\frac1{2^n}<\\varepsilon$, agar $n>\\log_2\\frac1\\varepsilon$."}, {"lvl": "B", "q": "$x_n=\\sum_{k=1}^n\\frac1{k^2}$ fundamental ekanini isbotlang.", "h": "$\\frac1{k^2}<\\frac1{k(k-1)}=\\frac1{k-1}-\\frac1k$.", "s": "$|x_{n+p}-x_n|<\\frac1n-\\frac1{n+p}<\\frac1n<\\varepsilon$."}, {"lvl": "C", "q": "Chegaralanmagan ketma-ketlikdan cheksiz katta qismiy ketma-ketlik ajratish mumkinligini isbotlang.", "h": "Yuqoridan chegaralanmagan bo‘lsa, $x_{n_1}>1$, $x_{n_2}>2$ ($n_2>n_1$) va h.k. tanlang.", "s": "Har bir $k$ uchun cheksiz ko‘p $n$ da $|x_n|>k$ (aks holda chegaralangan bo‘lardi). Shuning uchun $n_k>n_{k-1}$, $|x_{n_k}|>k$ tanlash mumkin."}], "parsons": [{"title": "Bolsano–Veyershtrass lemmasi isboti", "steps": ["$\\{x_n\\}\\subset[a,b]$ bo‘lsin.", "$[a,b]$ ni teng ikkiga bo‘lamiz; cheksiz ko‘p had joylashgan yarmini $[a_1,b_1]$ deb olamiz.", "Jarayonni takrorlab $[a_k,b_k]$ ichma-ich segmentlarni quramiz, $b_k-a_k=\\frac{b-a}{2^k}$.", "Har bir segmentdan $x_{n_k}\\in[a_k,b_k]$ ni $n_k>n_{k-1}$ shart bilan tanlaymiz.", "Kantor prinsipiga ko‘ra yagona $c\\in\\bigcap[a_k,b_k]$ mavjud.", "$|x_{n_k}-c|\\le\\frac{b-a}{2^k}\\to0$, demak $x_{n_k}\\to c$."], "dis": ["Ketma-ketlik monoton bo‘lgani uchun u yaqinlashadi."]}], "short": "B–V va Koshi", "az": "2-bob 5-§; 3-bob 9–11-§ (98–108-betlar)", "lebl": "2.3 Limit superior, limit inferior, and Bolzano–Weierstrass; 2.4 Cauchy sequences", "lab": ["nested", "subseq"], "goals": ["Ichma-ich segmentlar prinsipini qo‘llash", "Qismiy limitlar, yuqori va quyi limitlarni topish", "Koshi kriteriyasi yordamida yaqinlashishni tekshirish"]}, {"id": 6, "title": "Funksiya tushunchasi. Chegaralanganlik, monotonlik, juft-toqlik, davriylik. Teskari va murakkab funksiya. Elementar funksiyalar", "theory": [{"kind": "def", "title": "Funksiya", "body": "$X\\subset\\mathbb R$ to‘plamning har bir $x$ elementiga biror qoida bo‘yicha bitta $y\\in\\mathbb R$ son mos qo‘yilsa, $X$ da **funksiya** berilgan deyiladi: $y=f(x)$. $X=D(f)$ — aniqlanish sohasi, $f(X)=E(f)$ — qiymatlar to‘plami.\n\nFunksiya analitik (formula), jadval, grafik yoki so‘z bilan berilishi mumkin. Masalan, Dirixle funksiyasi: $D(x)=1$ ($x\\in\\mathbb Q$), $D(x)=0$ ($x\\notin\\mathbb Q$)."}, {"kind": "def", "title": "Asosiy xossalar", "body": "- **Chegaralangan:** $\\exists M\\ \\forall x\\in X:\\ |f(x)|\\le M$.\n- **O‘suvchi (kamayuvchi):** $x_1<x_2\\Rightarrow f(x_1)\\le f(x_2)$ ($\\ge$). Qat’iy tengsizlikda — qat’iy o‘suvchi (kamayuvchi).\n- **Juft:** $f(-x)=f(x)$ (grafigi $Oy$ ga simmetrik). **Toq:** $f(-x)=-f(x)$ (koordinata boshiga simmetrik). Aniqlanish sohasi 0 ga nisbatan simmetrik bo‘lishi kerak.\n- **Davriy:** $\\exists T>0\\ \\forall x:\\ f(x+T)=f(x)$. Eng kichik musbat $T$ — asosiy davr."}, {"kind": "def", "title": "Teskari funksiya", "body": "Agar $f:X\\to Y$ biyektiv bo‘lsa, har bir $y\\in Y$ ga $f(x)=y$ bo‘ladigan yagona $x$ ni mos qo‘yuvchi $f^{-1}$ funksiya **teskari funksiya** deyiladi. $y=f(x)$ va $y=f^{-1}(x)$ grafiklari $y=x$ to‘g‘ri chiziqqa nisbatan simmetrik.\n\n**Teorema:** qat’iy monoton funksiya teskari funksiyaga ega va u ham xuddi shunday monoton."}, {"kind": "def", "title": "Murakkab funksiya", "body": "$u=\\varphi(x)$, $y=f(u)$ va $\\varphi(X)\\subset D(f)$ bo‘lsa, $y=f(\\varphi(x))=(f\\circ\\varphi)(x)$ **murakkab funksiya** (superpozitsiya) deyiladi. Masalan, $y=\\sin^2x$: $u=\\sin x$, $y=u^2$. Umuman $f\\circ\\varphi\\ne\\varphi\\circ f$."}, {"kind": "formula", "title": "Asosiy elementar funksiyalar", "body": "- Darajali: $y=x^\\alpha$\n- Ko‘rsatkichli: $y=a^x$ ($a>0,a\\ne1$), $E=(0,+\\infty)$\n- Logarifmik: $y=\\log_ax$, $D=(0,+\\infty)$ — $a^x$ ga teskari\n- Trigonometrik: $\\sin x,\\cos x$ (davri $2\\pi$), $\\tan x,\\cot x$ (davri $\\pi$)\n- Teskari trigonometrik: $\\arcsin x,\\arccos x$ ($D=[-1,1]$), $\\arctan x,\\ \\text{arcctg}\\,x$\n\nBulardan chekli sondagi arifmetik amallar va superpozitsiya yordamida hosil qilingan funksiyalar **elementar funksiyalar** deyiladi."}], "quiz": [{"q": "$f(x)=\\frac{x^3}{1+x^2}$ funksiya qanday?", "o": ["Juft", "Toq", "Na juft, na toq", "Davriy"], "a": 1, "e": "$f(-x)=\\frac{-x^3}{1+x^2}=-f(x)$."}, {"q": "$f(x)=\\sin 3x$ ning asosiy davri qaysi?", "o": ["$2\\pi$", "$\\frac{2\\pi}3$", "$3\\pi$", "$\\frac\\pi3$"], "a": 1, "e": "$\\sin(3(x+T))=\\sin3x$ uchun $3T=2\\pi$."}, {"q": "$f(x)=2x+3$ ga teskari funksiya qaysi?", "o": ["$\\frac{x-3}{2}$", "$\\frac{x+3}{2}$", "$\\frac{1}{2x+3}$", "$3x+2$"], "a": 0, "e": "$y=2x+3\\Rightarrow x=\\frac{y-3}{2}$."}, {"q": "$f(x)=\\sqrt{4-x^2}+\\ln(x+1)$ ning aniqlanish sohasi qaysi?", "o": ["$[-2,2]$", "$(-1,2]$", "$(-1,+\\infty)$", "$[-1,2]$"], "a": 1, "e": "$4-x^2\\ge0$ va $x+1>0$."}, {"q": "$f(u)=u^2$, $\\varphi(x)=x+1$ bo‘lsa, $\\varphi(f(x))$ nimaga teng?", "o": ["$(x+1)^2$", "$x^2+1$", "$x^2+x$", "$2x+1$"], "a": 1, "e": "$\\varphi(f(x))=f(x)+1=x^2+1$, $f(\\varphi(x))=(x+1)^2$ — tartib muhim."}, {"q": "Qaysi funksiya chegaralangan?", "o": ["$\\tan x$", "$\\frac{x}{1+x^2}$", "$x\\sin x$", "$e^x$"], "a": 1, "e": "$|x|\\le\\frac{1+x^2}{2}$, demak $\\left|\\frac{x}{1+x^2}\\right|\\le\\frac12$."}, {"q": "$\\arcsin(\\sin 2)$ nimaga teng?", "o": ["$2$", "$\\pi-2$", "$2-\\pi$", "$\\frac\\pi2$"], "a": 1, "e": "$\\arcsin$ qiymatlari $[-\\frac\\pi2,\\frac\\pi2]$ da; $\\sin2=\\sin(\\pi-2)$ va $\\pi-2\\approx1{,}14$."}, {"q": "Dirixle funksiyasi qanday xossaga ega?", "o": ["Davri yo‘q", "Har qanday ratsional $T>0$ uning davri", "Faqat $T=1$ davr", "Toq"], "a": 1, "e": "$x$ va $x+T$ ($T\\in\\mathbb Q$) bir vaqtda ratsional yoki irratsional; asosiy davr yo‘q."}], "concept": [{"q": "$f(x)=x^2$ funksiya $\\mathbb R$ da teskari funksiyaga egami?", "o": ["Ha, $f^{-1}(x)=\\sqrt x$", "Yo‘q, chunki u inyektiv emas; $[0,+\\infty)$ ga toraytirilsa — ega", "Ha, $f^{-1}(x)=\\pm\\sqrt x$", "Yo‘q, chunki u uzluksiz emas"], "a": 1, "e": "$f(-2)=f(2)$; funksiya qiymati bitta bo‘lishi kerak, $\\pm\\sqrt x$ funksiya emas."}], "tf": [{"v": true, "s": "Juft va toq bo‘lgan yagona funksiya $f\\equiv0$ (simmetrik sohada).", "n": "$f(x)=f(-x)=-f(x)\\Rightarrow f(x)=0$."}, {"v": false, "s": "Ikki toq funksiya ko‘paytmasi toq.", "n": "U juft: $(-f)(-g)=fg$."}, {"v": true, "s": "Qat’iy o‘suvchi funksiyaning teskarisi ham qat’iy o‘suvchi.", "n": "Monotonlik saqlanadi."}, {"v": false, "s": "Har qanday davriy funksiyaning asosiy davri bor.", "n": "Dirixle funksiyasi yoki o‘zgarmas funksiya."}, {"v": true, "s": "$y=a^x$ va $y=\\log_ax$ grafiklari $y=x$ ga nisbatan simmetrik.", "n": "Ular o‘zaro teskari."}, {"v": true, "s": "Har qanday funksiyani juft va toq funksiyalar yig‘indisi ko‘rinishida yozish mumkin (simmetrik sohada).", "n": "$f=\\frac{f(x)+f(-x)}2+\\frac{f(x)-f(-x)}2$."}], "cards": [{"f": "Juft funksiya", "b": "$f(-x)=f(x)$, grafik $Oy$ ga simmetrik"}, {"f": "Toq funksiya", "b": "$f(-x)=-f(x)$, grafik $O$ nuqtaga simmetrik"}, {"f": "Davriy funksiya", "b": "$f(x+T)=f(x)$, $T>0$"}, {"f": "Teskari funksiya grafigi", "b": "$y=x$ ga nisbatan simmetrik"}, {"f": "Murakkab funksiya", "b": "$(f\\circ\\varphi)(x)=f(\\varphi(x))$"}, {"f": "$\\arcsin x$", "b": "$D=[-1,1]$, $E=[-\\frac\\pi2,\\frac\\pi2]$"}], "tasks": [{"lvl": "A", "q": "$f(x)=\\frac{1}{\\sqrt{x^2-5x+6}}$ ning aniqlanish sohasini toping.", "h": "$x^2-5x+6>0$.", "s": "$(x-2)(x-3)>0$: $D=(-\\infty,2)\\cup(3,+\\infty)$."}, {"lvl": "A", "q": "$f(x)=\\cos^2x$ ning asosiy davrini toping (π ning ulushi sifatida, masalan 1 — π uchun).", "ans": 1.0, "h": "$\\cos^2x=\\frac{1+\\cos2x}2$.", "s": "Asosiy davr $\\pi$."}, {"lvl": "B", "q": "$f(x)=\\frac{e^x-e^{-x}}{2}$ ($\\text{sh}\\,x$) ga teskari funksiyani toping.", "h": "$e^x=t$ deb, $t^2-2yt-1=0$ ni yeching.", "s": "$t=y+\\sqrt{y^2+1}$, demak $f^{-1}(x)=\\ln\\left(x+\\sqrt{x^2+1}\\right)$."}, {"lvl": "B", "q": "$f(x)=\\ln\\frac{1-x}{1+x}$ toq ekanini isbotlang.", "h": "$f(-x)$ ni hisoblang.", "s": "$f(-x)=\\ln\\frac{1+x}{1-x}=-\\ln\\frac{1-x}{1+x}=-f(x)$, $D=(-1,1)$ simmetrik."}, {"lvl": "C", "q": "Agar $f$ davri $T_1$ va $g$ davri $T_2$ bo‘lsa va $T_1/T_2\\in\\mathbb Q$ bo‘lsa, $f+g$ davriy ekanini isbotlang. $\\sin x+\\sin\\sqrt2x$ davriymi?", "h": "$T_1/T_2=p/q$ bo‘lsa, $T=qT_1=pT_2$ ni sinab ko‘ring.", "s": "$T=qT_1=pT_2$ umumiy davr. $h(x)=\\sin x+\\sin\\sqrt2x$ davriy emas: agar $h(x+T)=h(x)$ bo‘lsa, $h''(x+T)=h''(x)$ ham bajariladi, ya’ni $\\sin(x+T)+2\\sin\\sqrt2(x+T)=\\sin x+2\\sin\\sqrt2x$. Bu ikki tenglikdan $\\sin(x+T)\\equiv\\sin x$ va $\\sin\\sqrt2(x+T)\\equiv\\sin\\sqrt2x$, demak $T=2\\pi k$, $\\sqrt2T=2\\pi m$, bundan $\\sqrt2=m/k\\in\\mathbb Q$ — ziddiyat."}], "parsons": [], "short": "Funksiya", "az": "4-bob, 1–2-§ (109–127-betlar)", "lebl": "0.3 (functions); 3.1 Limits of functions (kirish)", "lab": ["fgraph"], "goals": ["Funksiyaning asosiy xossalarini tekshirish", "Teskari va murakkab funksiyani topish", "Asosiy elementar funksiyalar grafiklari va xossalarini bilish"]}, {"id": 7, "title": "Funksiya limitining ta’riflari. Limitga ega bo‘lgan funksiyalarning xossalari", "theory": [{"kind": "def", "title": "Koshi ta’rifi ($\\varepsilon$–$\\delta$ tilida)", "body": "$f(x)$ funksiya $a$ nuqtaning biror o‘yilgan atrofida aniqlangan bo‘lsin. $b$ son $f$ ning $x\\to a$ dagi **limiti** deyiladi, agar\n$$\\forall\\varepsilon>0\\ \\exists\\delta>0\\ \\forall x:\\ 0<|x-a|<\\delta\\Rightarrow|f(x)-b|<\\varepsilon.$$\nYozuv: $\\lim\\limits_{x\\to a}f(x)=b$. E’tibor bering: $f(a)$ ning qiymati (va umuman mavjudligi) limitga ta’sir qilmaydi."}, {"kind": "def", "title": "Geyne ta’rifi (ketma-ketliklar tilida)", "body": "$\\lim\\limits_{x\\to a}f(x)=b$, agar $a$ ga intiluvchi har qanday $x_n\\ne a$ ketma-ketlik uchun $f(x_n)\\to b$ bo‘lsa.\n\n**Teorema:** Koshi va Geyne ta’riflari ekvivalent.\n\nGeyne ta’rifi limit **mavjud emasligini** isbotlashda qulay: ikki xil $x_n\\to a$, $x_n'\\to a$ uchun $f(x_n)$ va $f(x_n')$ turli limitlarga intilsa, limit yo‘q."}, {"kind": "ex", "title": "$\\lim\\limits_{x\\to0}\\sin\\frac1x$ mavjud emas", "body": "$x_n=\\frac{1}{\\pi n}\\to0$ uchun $\\sin\\frac1{x_n}=0$; $x_n'=\\frac{1}{\\frac\\pi2+2\\pi n}\\to0$ uchun $\\sin\\frac1{x_n'}=1$. Limitlar turli — demak limit mavjud emas."}, {"kind": "def", "title": "Bir tomonlama limitlar va cheksizlikdagi limit", "body": "- O‘ng limit: $f(a+0)=\\lim\\limits_{x\\to a+0}f(x)$ — faqat $a<x<a+\\delta$ da.\n- Chap limit: $f(a-0)=\\lim\\limits_{x\\to a-0}f(x)$.\n- $\\lim\\limits_{x\\to a}f(x)$ mavjud $\\iff f(a-0)=f(a+0)$.\n- $\\lim\\limits_{x\\to+\\infty}f(x)=b$: $\\forall\\varepsilon\\ \\exists\\Delta\\ \\forall x>\\Delta:\\ |f(x)-b|<\\varepsilon$."}, {"kind": "thm", "title": "Limitga ega funksiyalarning xossalari", "body": "$\\lim\\limits_{x\\to a}f(x)=b$, $\\lim\\limits_{x\\to a}g(x)=c$ bo‘lsin.\n1. Limit yagona; $f$ biror o‘yilgan atrofda chegaralangan.\n2. $b>0$ bo‘lsa, $a$ ning biror atrofida $f(x)>0$ (ishora saqlanishi).\n3. $\\lim(f\\pm g)=b\\pm c$, $\\lim fg=bc$, $\\lim\\frac fg=\\frac bc$ ($c\\ne0$).\n4. $f(x)\\le g(x)$ bo‘lsa, $b\\le c$. Siqish teoremasi ham o‘rinli."}, {"kind": "ex", "title": "$\\varepsilon$–$\\delta$ isbot: $\\lim\\limits_{x\\to2}x^2=4$", "body": "$|x^2-4|=|x-2||x+2|$. $|x-2|<1$ deb olsak, $|x+2|<5$. U holda $|x^2-4|<5|x-2|<\\varepsilon$, agar $|x-2|<\\frac\\varepsilon5$. Demak $\\delta=\\min\\left(1,\\frac\\varepsilon5\\right)$."}], "quiz": [{"q": "$\\lim\\limits_{x\\to3}\\frac{x^2-9}{x-3}$ ni toping.", "o": ["$0$", "$6$", "$3$", "Mavjud emas"], "a": 1, "e": "$\\frac{(x-3)(x+3)}{x-3}=x+3\\to6$."}, {"q": "$f(x)=\\frac{|x|}{x}$ uchun $f(0+0)$ va $f(0-0)$ qaysi?", "o": ["$1$ va $-1$", "$-1$ va $1$", "$0$ va $0$", "Ikkalasi $1$"], "a": 0, "e": "$x>0$ da $f=1$, $x<0$ da $f=-1$; limit $x\\to0$ da mavjud emas."}, {"q": "$\\lim\\limits_{x\\to2}(3x-1)=5$ isbotida $\\varepsilon$ ga mos $\\delta$ qaysi?", "o": ["$\\delta=\\varepsilon$", "$\\delta=\\frac\\varepsilon3$", "$\\delta=3\\varepsilon$", "$\\delta=\\varepsilon-3$"], "a": 1, "e": "$|3x-1-5|=3|x-2|<\\varepsilon\\iff|x-2|<\\frac\\varepsilon3$."}, {"q": "$\\lim\\limits_{x\\to\\infty}\\frac{2x^2-x}{5x^2+3}$ ni toping.", "o": ["$\\frac25$", "$0$", "$\\infty$", "$-\\frac13$"], "a": 0, "e": "Eng katta darajalar koeffitsiyentlari nisbati."}, {"q": "$\\lim\\limits_{x\\to0}x\\sin\\frac1x$ nimaga teng?", "o": ["$0$", "$1$", "Mavjud emas", "$\\infty$"], "a": 0, "e": "$|x\\sin\\frac1x|\\le|x|\\to0$ (chegaralangan × cheksiz kichik)."}, {"q": "Qaysi ta’rif limit mavjud emasligini isbotlash uchun qulayroq?", "o": ["Koshi ta’rifi", "Geyne ta’rifi", "Ikkalasi bir xil", "Hech biri"], "a": 1, "e": "Ikki ketma-ketlikda turli limitlar ko‘rsatish yetarli."}, {"q": "$\\lim\\limits_{x\\to4}\\frac{\\sqrt x-2}{x-4}$ ni toping.", "o": ["$0$", "$\\frac14$", "$\\frac12$", "$4$"], "a": 1, "e": "$\\frac{\\sqrt x-2}{(\\sqrt x-2)(\\sqrt x+2)}=\\frac1{\\sqrt x+2}\\to\\frac14$."}, {"q": "$\\lim\\limits_{x\\to1-0}\\frac{1}{1-x}$ nimaga teng?", "o": ["$+\\infty$", "$-\\infty$", "$0$", "$1$"], "a": 0, "e": "$x<1$ da $1-x\\to0^+$."}], "concept": [{"q": "$f(x)=\\frac{x^2-1}{x-1}$ funksiya $x=1$ da aniqlanmagan. $\\lim\\limits_{x\\to1}f(x)$ haqida nima deysiz?", "o": ["Mavjud emas, chunki $f(1)$ aniqlanmagan", "Mavjud va 2 ga teng", "$\\frac00$ ga teng", "$\\infty$ ga teng"], "a": 1, "e": "Limit ta’rifida $x\\ne a$; $x\\ne1$ da $f(x)=x+1\\to2$."}], "tf": [{"v": true, "s": "Funksiyaning $a$ nuqtadagi limiti $f(a)$ ga bog‘liq emas.", "n": "Ta’rifda $0<|x-a|$."}, {"v": false, "s": "Agar $f(x)>0$ va $\\lim f(x)=b$ bo‘lsa, $b>0$.", "n": "Faqat $b\\ge0$: $x^2\\to0$."}, {"v": true, "s": "Limit mavjud bo‘lishi uchun chap va o‘ng limitlar teng bo‘lishi zarur va yetarli.", "n": "Bir tomonlama limitlar haqidagi teorema."}, {"v": true, "s": "Koshi va Geyne ta’riflari ekvivalent.", "n": "Asosiy teorema."}, {"v": false, "s": "$\\lim\\limits_{x\\to0}\\cos\\frac1x=1$.", "n": "Limit mavjud emas."}, {"v": true, "s": "Agar $\\lim f=b\\ne0$ bo‘lsa, $a$ atrofida $f$ ning ishorasi $b$ niki bilan bir xil.", "n": "Ishora saqlanish xossasi."}], "cards": [{"f": "Koshi ta’rifi", "b": "$\\forall\\varepsilon\\ \\exists\\delta\\ \\forall x: 0<|x-a|<\\delta\\Rightarrow|f(x)-b|<\\varepsilon$"}, {"f": "Geyne ta’rifi", "b": "$\\forall x_n\\to a,\\ x_n\\ne a:\\ f(x_n)\\to b$"}, {"f": "O‘ng limit", "b": "$f(a+0)=\\lim_{x\\to a,\\ x>a}f(x)$"}, {"f": "Limit mavjudligi sharti", "b": "$f(a-0)=f(a+0)$"}, {"f": "$\\lim_{x\\to0}x\\sin\\frac1x$", "b": "$0$"}, {"f": "$\\lim_{x\\to0}\\sin\\frac1x$", "b": "Mavjud emas"}], "tasks": [{"lvl": "A", "q": "$\\lim\\limits_{x\\to2}\\frac{x^2-5x+6}{x^2-4}$ ni hisoblang.", "ans": -0.25, "h": "Ko‘paytuvchilarga ajrating.", "s": "$\\frac{(x-2)(x-3)}{(x-2)(x+2)}=\\frac{x-3}{x+2}\\to-\\frac14$."}, {"lvl": "A", "q": "$\\lim\\limits_{x\\to\\infty}\\left(\\sqrt{x^2+4x}-x\\right)$ ni hisoblang.", "ans": 2.0, "h": "Qo‘shmasiga ko‘paytiring.", "s": "$\\frac{4x}{\\sqrt{x^2+4x}+x}\\to\\frac42=2$."}, {"lvl": "B", "q": "$\\varepsilon$–$\\delta$ ta’rifi bilan isbotlang: $\\lim\\limits_{x\\to1}\\frac1x=1$.", "h": "$|x-1|<\\frac12$ deb, $|x|>\\frac12$ dan foydalaning.", "s": "$\\left|\\frac1x-1\\right|=\\frac{|x-1|}{|x|}<2|x-1|<\\varepsilon$, agar $\\delta=\\min(\\frac12,\\frac\\varepsilon2)$."}, {"lvl": "B", "q": "Geyne ta’rifi yordamida $\\lim\\limits_{x\\to\\infty}\\sin x$ mavjud emasligini isbotlang.", "h": "$x_n=\\pi n$ va $x_n'=\\frac\\pi2+2\\pi n$.", "s": "$\\sin x_n=0\\to0$, $\\sin x_n'=1\\to1$; limitlar turli."}, {"lvl": "C", "q": "Dirixle funksiyasi $D(x)$ ning hech bir nuqtada limiti yo‘qligini isbotlang. $x\\,D(x)$ funksiya qaysi nuqtada limitga ega?", "h": "Har qanday $a$ ga ratsional va irratsional ketma-ketliklar bilan yaqinlashing.", "s": "$r_n\\to a$ ($r_n\\in\\mathbb Q$): $D=1$; $s_n\\to a$ (irratsional): $D=0$. $xD(x)$ faqat $a=0$ da limitga ega (0 ga teng), chunki $|xD(x)|\\le|x|$."}], "parsons": [{"title": "$\\lim_{x\\to2}x^2=4$ ning $\\varepsilon$–$\\delta$ isboti", "steps": ["Ixtiyoriy $\\varepsilon>0$ olamiz.", "$|x^2-4|=|x-2|\\cdot|x+2|$ deb yozamiz.", "$|x-2|<1$ bo‘lsa, $1<x<3$ va $|x+2|<5$.", "U holda $|x^2-4|<5|x-2|$.", "$\\delta=\\min(1,\\varepsilon/5)$ olsak, $0<|x-2|<\\delta\\Rightarrow|x^2-4|<\\varepsilon$."], "dis": ["$\\delta=\\varepsilon$ deb olamiz, chunki funksiya uzluksiz."]}], "short": "Funksiya limiti", "az": "4-bob, 3–4-§ (127–141-betlar)", "lebl": "3.1 Limits of functions", "lab": ["epsdelta"], "goals": ["Koshi ($\\varepsilon$–$\\delta$) va Geyne (ketma-ketliklar tili) ta’riflarini qo‘llash", "Bir tomonlama limitlarni topish", "Limitlar ustida arifmetik amallar va tengsizlikda limitga o‘tish"]}, {"id": 8, "title": "Funksiya limitining mavjudligi haqida teoremalar. Muhim limitlar", "theory": [{"kind": "thm", "title": "Monoton funksiya limiti", "body": "Agar $f$ $(a,b)$ da o‘suvchi va yuqoridan chegaralangan bo‘lsa, $\\lim\\limits_{x\\to b-0}f(x)=\\sup\\limits_{(a,b)}f(x)$ mavjud. Xususan, monoton funksiya har bir ichki nuqtada chekli bir tomonlama limitlarga ega."}, {"kind": "thm", "title": "Koshi kriteriyasi (funksiya uchun)", "body": "$\\lim\\limits_{x\\to a}f(x)$ chekli limit mavjud bo‘lishi uchun\n$$\\forall\\varepsilon>0\\ \\exists\\delta>0\\ \\forall x',x'':\\ 0<|x'-a|<\\delta,\\ 0<|x''-a|<\\delta\\Rightarrow|f(x')-f(x'')|<\\varepsilon$$\nshartning bajarilishi zarur va yetarli."}, {"kind": "thm", "title": "Birinchi ajoyib limit", "body": "$$\\lim_{x\\to0}\\frac{\\sin x}{x}=1$$", "more": "$0<x<\\frac\\pi2$ da birlik aylanada yuzalarni taqqoslab: $\\sin x<x<\\tan x$. Bundan $\\cos x<\\frac{\\sin x}{x}<1$. $\\cos x\\to1$; siqish teoremasi. Funksiya juft bo‘lgani uchun $x<0$ da ham shunday.", "moreLabel": "Isbot g‘oyasi"}, {"kind": "thm", "title": "Ikkinchi ajoyib limit", "body": "$$\\lim_{x\\to\\infty}\\left(1+\\frac1x\\right)^x=e,\\qquad\\lim_{x\\to0}(1+x)^{1/x}=e.$$", "more": "$n=[x]$ bo‘lsa, $\\left(1+\\frac1{n+1}\\right)^n\\le\\left(1+\\frac1x\\right)^x\\le\\left(1+\\frac1n\\right)^{n+1}$. Chetkilar $e$ ga intiladi (ketma-ketlik limitidan).", "moreLabel": "Isbot g‘oyasi"}, {"kind": "formula", "title": "Ulardan kelib chiqadigan limitlar ($x\\to0$)", "body": "- $\\frac{\\tan x}{x}\\to1$, $\\frac{\\arcsin x}{x}\\to1$, $\\frac{\\arctan x}{x}\\to1$\n- $\\frac{1-\\cos x}{x^2}\\to\\frac12$\n- $\\frac{\\ln(1+x)}{x}\\to1$, $\\frac{\\log_a(1+x)}{x}\\to\\frac1{\\ln a}$\n- $\\frac{e^x-1}{x}\\to1$, $\\frac{a^x-1}{x}\\to\\ln a$\n- $\\frac{(1+x)^\\mu-1}{x}\\to\\mu$"}, {"kind": "formula", "title": "$1^\\infty$ aniqmaslik uchun usul", "body": "Agar $u(x)\\to1$, $v(x)\\to\\infty$ bo‘lsa:\n$$\\lim u^v=e^{\\lim v(u-1)}.$$\nMasalan, $\\lim\\limits_{x\\to\\infty}\\left(\\frac{x+3}{x}\\right)^{2x}=e^{\\lim 2x\\cdot\\frac3x}=e^6$."}], "quiz": [{"q": "$\\lim\\limits_{x\\to0}\\frac{\\sin5x}{x}$ ni toping.", "o": ["$1$", "$5$", "$\\frac15$", "$0$"], "a": 1, "e": "$\\frac{\\sin5x}{5x}\\cdot5\\to5$."}, {"q": "$\\lim\\limits_{x\\to0}\\frac{\\sin3x}{\\sin7x}$ ni toping.", "o": ["$\\frac37$", "$\\frac73$", "$1$", "$21$"], "a": 0, "e": "$\\frac{3x}{7x}$ nisbatga keltiramiz."}, {"q": "$\\lim\\limits_{x\\to0}\\frac{1-\\cos4x}{x^2}$ nimaga teng?", "o": ["$4$", "$8$", "$16$", "$2$"], "a": 1, "e": "$1-\\cos4x=2\\sin^22x\\sim2(2x)^2=8x^2$."}, {"q": "$\\lim\\limits_{x\\to\\infty}\\left(1+\\frac3x\\right)^x$ ni toping.", "o": ["$3$", "$e$", "$e^3$", "$\\infty$"], "a": 2, "e": "$e^{\\lim x\\cdot\\frac3x}=e^3$."}, {"q": "$\\lim\\limits_{x\\to0}\\frac{\\ln(1 iz kichik va cheksiz katta funksiya", "body": "$\\alpha(x)$ funksiya $x\\to a$ da **cheksiz kichik** deyiladi, agar $\\lim\\limits_{x\\to a}\\alpha(x)=0$. **Cheksiz katta**: $\\lim\\limits_{x\\to a}|f(x)|=+\\infty$.\n\n$\\lim f(x)=b\\iff f(x)=b+\\alpha(x)$, bu yerda $\\alpha$ cheksiz kichik."}, {"kind": "def", "title": "Taqqoslash belgilari ($x\\to a$)", "body": "$\\alpha$ va $\\beta$ cheksiz kichik bo‘lsin.\n- $\\alpha=o(\\beta)$ — $\\alpha$ **yuqoriroq tartibli** cheksiz kichik: $\\lim\\frac\\alpha\\beta=0$.\n- $\\alpha$ va $\\beta$ **bir xil tartibli**: $\\lim\\frac\\alpha\\beta=c\\ne0$.\n- $\\alpha\\sim\\beta$ — **ekvivalent**: $\\lim\\frac\\alpha\\beta=1$.\n- $\\alpha=O(\\beta)$: $a$ atrofida $|\\alpha|\\le C|\\beta|$.\n- $\\alpha$ ning $\\beta$ ga nisbatan tartibi $k$: $\\alpha$ va $\\beta^k$ bir xil tartibli."}, {"kind": "formula", "title": "Asosiy ekvivalentliklar ($x\\to0$)", "body": "$$\\sin x\\sim\\tan x\\sim\\arcsin x\\sim\\arctan x\\sim\\ln(1+x)\\sim e^x-1\\sim x$$\n$$1-\\cos x\\sim\\frac{x^2}2,\\quad a^x-1\\sim x\\ln a,\\quad(1+x)^\\mu-1\\sim\\mu x$$"}, {"kind": "thm", "title": "Ekvivalentga almashtirish", "body": "Agar $\\alpha\\sim\\alpha_1$, $\\beta\\sim\\beta_1$ bo‘lsa,\n$$\\lim\\frac{\\alpha}{\\beta}=\\lim\\frac{\\alpha_1}{\\beta_1}.$$\nKo‘paytma va bo‘linmada almashtirish mumkin; yig‘indi va ayirmada esa ehtiyot bo‘ling: $\\tan x-\\sin x$ ni $x-x=0$ ga almashtirish xato!"}, {"kind": "thm", "title": "$\\alpha\\sim\\beta\\iff\\alpha-\\beta=o(\\alpha)$", "body": "Ikki ekvivalent cheksiz kichik ayirmasi ularning har biridan yuqoriroq tartibli. Masalan, $\\sin x=x+o(x)$, $\\ln(1+x)=x+o(x)$."}, {"kind": "ex", "title": "Ehtiyot bo‘ling: $\\lim\\limits_{x\\to0}\\frac{\\tan x-\\sin x}{x^3}$", "body": "$\\tan x-\\sin x=\\tan x(1-\\cos x)\\sim x\\cdot\\frac{x^2}2$. Javob: $\\frac12$. Ayirmani to‘g‘ridan-to‘g‘ri almashtirish noto‘g‘ri natija (0) beradi."}], "quiz": [{"q": "$x\\to0$ da $1-\\cos x$ ning $x$ ga nisbatan tartibi qaysi?", "o": ["$1$", "$2$", "$3$
